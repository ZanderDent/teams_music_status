name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A fork's pull request gets a read-only token and no secrets. Nothing here needs
# either, so PRs from strangers run safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        # The image's default Xcode can be older than the package requires — a default of
        # Xcode 15 ships Swift 5.10, and Package.swift declares swift-tools-version 6.0.
        # Picking the newest installed Xcode avoids pinning a version that will rot, and
        # avoids depending on a third-party action to do it.
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        # The unit tests cover the sync rules, template rendering, Unicode handling and
        # Spotify parsing. Anything that needs a real Microsoft Teams, real Accessibility
        # permission or a Spotify account cannot run on a hosted runner — those live in
        # docs/ACCEPTANCE_TESTS.md and are run by hand before release.
        run: swift test

  package:
    name: Unsigned release artifact
    runs-on: macos-15
    timeout-minutes: 25
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Build the app icon
        # Regenerated rather than taken from the committed .icns so a broken generator
        # is caught here instead of at release time.
        run: |
          set -euo pipefail
          # A virtualenv, not a plain pip install: the runner's Python is Homebrew's and
          # is marked externally managed, so installing into it fails under PEP 668.
          python3 -m venv "$RUNNER_TEMP/iconenv"
          "$RUNNER_TEMP/iconenv/bin/pip" install --quiet --disable-pip-version-check pillow numpy
          "$RUNNER_TEMP/iconenv/bin/python" Assets/AppIcon/make-icon.py
          iconutil -c icns Assets/AppIcon/AppIcon.iconset -o Assets/AppIcon/AppIcon.icns

      - name: Package (unsigned)
        # Deliberately unsigned. Signing and notarization need a Developer ID
        # certificate and an app-specific password, and neither belongs in CI secrets
        # for a project this size — releases are cut on the maintainer's Mac. This job
        # exists to catch packaging regressions, not to produce a downloadable build.
        run: ./scripts/release.sh --unsigned --skip-tests

      - name: Verify the artifact
        run: |
          set -euo pipefail
          test -f dist/Teams-Music-Status-*.dmg
          MP=$(mktemp -d)
          hdiutil attach dist/Teams-Music-Status-*.dmg -mountpoint "$MP" -nobrowse -noautoopen
          test -d "$MP/Teams Music Status.app"          || { echo "app missing from DMG"; exit 1; }
          test -L "$MP/Applications"                     || { echo "Applications alias missing"; exit 1; }
          lipo -archs "$MP/Teams Music Status.app/Contents/MacOS/TeamsMusicStatus"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$MP/Teams Music Status.app/Contents/Info.plist"
          hdiutil detach "$MP"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-dmg-validation
          path: |
            dist/*.dmg
            dist/release-info.txt
          retention-days: 7

  guard:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: No credentials committed
        run: |
          set -euo pipefail
          fail=0

          # Files that must never be tracked, regardless of .gitignore drift.
          for forbidden in .env Config/Spotify.plist; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "::error file=$forbidden::$forbidden must never be committed"
              fail=1
            fi
          done

          # The app uses OAuth with PKCE and must never reference a client secret.
          if git grep -nIE 'SPOTIFY_CLIENT_SECRET|client_secret' -- Sources Tests scripts \
               | grep -vE 'never|not used|no client secret|does not need|without a secret' ; then
            echo "::error::a client secret is referenced in source; this app uses PKCE and must not use one"
            fail=1
          fi

          # Tokens must only ever reach a logger through Redact.secret, which prints a
          # length and nothing else. Lines that already go through it are the correct
          # pattern, not a violation — excluding them is what keeps this check useful
          # rather than something people learn to ignore.
          if git grep -nIE 'accessToken|refreshToken|codeVerifier|code_verifier' -- Sources \
               | grep -iE 'Log\.|logger|print\(' \
               | grep -v 'Redact\.secret' ; then
            echo "::error::a credential may reach a logger unredacted; wrap it in Redact.secret"
            fail=1
          fi

          exit $fail

      - name: No absolute developer paths
        run: |
          set -euo pipefail
          if git grep -nI '/Users/[a-z]' -- Sources Tests scripts docs *.md ; then
            echo "::error::absolute paths from a developer's machine must not be committed"
            exit 1
          fi

      - name: No screen coordinates in the automation
        # The whole design depends on semantic accessibility selectors. A patch that
        # reaches for geometry is a regression even if it works.
        run: |
          set -euo pipefail
          if git grep -nE 'kAXPositionAttribute|kAXFrameAttribute|kAXSizeAttribute' \
               -- Sources/TeamsMusicStatusCore/Targets ; then
            echo "::error::the Teams automation must not read screen geometry"
            exit 1
          fi

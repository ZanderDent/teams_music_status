name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A fork's pull request gets a read-only token and no secrets. Nothing here needs
# either, so PRs from strangers run safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        # The image's default Xcode can be older than the package requires — a default of
        # Xcode 15 ships Swift 5.10, and Package.swift declares swift-tools-version 6.0.
        # Picking the newest installed Xcode avoids pinning a version that will rot, and
        # avoids depending on a third-party action to do it.
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        # The unit tests cover the sync rules, template rendering, Unicode handling and
        # Spotify parsing. Anything that needs a real Microsoft Teams, real Accessibility
        # permission or a Spotify account cannot run on a hosted runner — those live in
        # docs/ACCEPTANCE_TESTS.md and are run by hand before release.
        run: swift test

  build-and-test-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install the Swift toolchain
        shell: pwsh
        # Installed straight from swift.org rather than through a third-party action, for
        # the same reason Xcode is selected by hand above. The version is pinned because
        # the installer URL contains it; bump it deliberately.
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '6.0.3'
          $url = "https://download.swift.org/swift-$version-release/windows10/swift-$version-RELEASE/swift-$version-RELEASE-windows10.exe"
          $exe = "$env:RUNNER_TEMP\swift-installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList '/quiet','/norestart' -Wait
          echo "$env:LOCALAPPDATA\Programs\Swift\Toolchains\$version+Asserts\usr\bin" >> $env:GITHUB_PATH
          echo "$env:LOCALAPPDATA\Programs\Swift\Runtimes\$version\usr\bin" >> $env:GITHUB_PATH

      - name: Build and test
        shell: cmd
        # vcvars64 replaces the whole environment block, which drops the Swift installer's
        # SDKROOT. Without it swiftc cannot find the Windows stdlib and fails with
        # "unable to load standard library for target x86_64-unknown-windows-msvc", which
        # does not obviously point at the cause. See docs/WINDOWS.md §10.
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set SDKROOT=%LOCALAPPDATA%\Programs\Swift\Platforms\6.0.3\Windows.platform\Developer\SDKs\Windows.sdk
          swift --version || exit /b 1
          swift build --build-tests || exit /b 1
          swift test || exit /b 1

  package:
    name: Unsigned release artifact
    runs-on: macos-15
    timeout-minutes: 25
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Build the app icon
        # Regenerated rather than taken from the committed .icns so a broken generator
        # is caught here instead of at release time.
        run: |
          set -euo pipefail
          # A virtualenv, not a plain pip install: the runner's Python is Homebrew's and
          # is marked externally managed, so installing into it fails under PEP 668.
          python3 -m venv "$RUNNER_TEMP/iconenv"
          "$RUNNER_TEMP/iconenv/bin/pip" install --quiet --disable-pip-version-check pillow numpy
          "$RUNNER_TEMP/iconenv/bin/python" Assets/AppIcon/make-icon.py
          iconutil -c icns Assets/AppIcon/AppIcon.iconset -o Assets/AppIcon/AppIcon.icns

      - name: Package (unsigned)
        # Deliberately unsigned. Signing and notarization need a Developer ID
        # certificate and an app-specific password, and neither belongs in CI secrets
        # for a project this size — releases are cut on the maintainer's Mac. This job
        # exists to catch packaging regressions, not to produce a downloadable build.
        run: ./scripts/release.sh --unsigned --skip-tests

      - name: Verify the artifact
        run: |
          set -euo pipefail
          test -f dist/Teams-Music-Status-*.dmg
          MP=$(mktemp -d)
          hdiutil attach dist/Teams-Music-Status-*.dmg -mountpoint "$MP" -nobrowse -noautoopen
          test -d "$MP/Teams Music Status.app"          || { echo "app missing from DMG"; exit 1; }
          test -L "$MP/Applications"                     || { echo "Applications alias missing"; exit 1; }
          lipo -archs "$MP/Teams Music Status.app/Contents/MacOS/TeamsMusicStatus"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$MP/Teams Music Status.app/Contents/Info.plist"
          hdiutil detach "$MP"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-dmg-validation
          path: |
            dist/*.dmg
            dist/release-info.txt
          retention-days: 7

  guard:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: No credentials committed
        run: |
          set -euo pipefail
          fail=0

          # Files that must never be tracked, regardless of .gitignore drift.
          for forbidden in .env Config/Spotify.plist; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "::error file=$forbidden::$forbidden must never be committed"
              fail=1
            fi
          done

          # The app uses OAuth with PKCE and must never reference a client secret.
          if git grep -nIE 'SPOTIFY_CLIENT_SECRET|client_secret' -- Sources Tests scripts \
               | grep -vE 'never|not used|no client secret|does not need|without a secret' ; then
            echo "::error::a client secret is referenced in source; this app uses PKCE and must not use one"
            fail=1
          fi

          # Tokens must only ever reach a logger through Redact.secret, which prints a
          # length and nothing else. Lines that already go through it are the correct
          # pattern, not a violation — excluding them is what keeps this check useful
          # rather than something people learn to ignore.
          if git grep -nIE 'accessToken|refreshToken|codeVerifier|code_verifier' -- Sources \
               | grep -iE 'Log\.|logger|print\(' \
               | grep -v 'Redact\.secret' ; then
            echo "::error::a credential may reach a logger unredacted; wrap it in Redact.secret"
            fail=1
          fi

          exit $fail

      - name: No absolute developer paths
        run: |
          set -euo pipefail
          if git grep -nI '/Users/[a-z]' -- Sources Tests scripts docs *.md ; then
            echo "::error::absolute paths from a developer's machine must not be committed"
            exit 1
          fi

      - name: No screen coordinates in the automation
        # The whole design depends on semantic accessibility selectors. A patch that
        # reaches for geometry is a regression even if it works.
        run: |
          set -euo pipefail
          if git grep -nE 'kAXPositionAttribute|kAXFrameAttribute|kAXSizeAttribute' \
               -- Sources/TeamsMusicStatusCore/Targets ; then
            echo "::error::the Teams automation must not read screen geometry"
            exit 1
          fi

          # The same rule on Windows. BoundingRectangle and GetClickablePoint are the UI
          # Automation routes to geometry; SendInput and the mouse_event family are global
          # and coordinate-based, so they would also break the no-focus-theft rule.
          if git grep -nE 'BoundingRectangle|GetClickablePoint|SendInput|SetCursorPos|mouse_event|WM_LBUTTONDOWN' \
               -- Sources/CTeamsWin Sources/TeamsMusicStatusWindows ; then
            echo "::error::the Windows Teams automation must not use screen geometry or global input"
            exit 1
          fi

      - name: Windows automation must not activate Teams
        # UIA SetFocus and ExpandCollapsePattern.Expand both pull Teams to the foreground,
        # and SW_RESTORE activates where SW_SHOWNOACTIVATE does not. All three work, which
        # is exactly why they need guarding against: the failure is a rude app, not a
        # broken build. tw_park_focus is test-only scaffolding and lives in CTeamsWin.
        run: |
          set -euo pipefail
          # Comments are excluded: the reason these are forbidden is documented right next
          # to the code that avoids them, and a check that fires on its own rationale is
          # one people learn to ignore.
          if git grep -nE 'SetFocus|ExpandCollapsePattern|SW_RESTORE' \
               -- Sources/TeamsMusicStatusWindows Sources/TeamsMusicStatusWin \
               | grep -vE ':[0-9]+:[[:space:]]*(///|//|\*)' ; then
            echo "::error::this activates Teams; use MSAA accDoDefaultAction and SW_SHOWNOACTIVATE"
            exit 1
          fi

      - name: Windows install scripts must close the app, not kill it
        # The shutdown path is what restores the status the user had before syncing. A
        # force-kill skips it and strands whatever track was showing, so Stop-Process is
        # only permissible as a fallback after a graceful close has been attempted.
        run: |
          set -euo pipefail
          for script in scripts/windows-install/Install.ps1 scripts/windows-install/Uninstall.ps1 ; do
            if grep -q 'Stop-Process' "$script" && ! grep -q 'WM_CLOSE\|0x0010' "$script" ; then
              echo "::error file=$script::kills the app without asking it to close first"
              exit 1
            fi
          done
